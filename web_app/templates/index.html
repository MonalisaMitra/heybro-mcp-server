{% extends "base.html" %}

{% block content %}
    <form id="search-form" class="search-row" autocomplete="off">
      <input id="q" type="search" name="q" placeholder="Search a place — e.g. Darjeeling, Kathmandu, Manila" required>
      <button type="submit">Search</button>
      <button type="button" id="use-here" title="Use my current location">📍 Near me</button>
    </form>

    <div id="suggestions" class="suggestions" hidden></div>

    <p class="small muted quick-links">
      <a href="{{ url_for('explore_page') }}">🗺 Explore culture, food &amp; sights</a>
      · <a href="{{ url_for('book_page') }}">✈ Book travel</a>
      · <a href="{{ url_for('guide_page') }}">🗣 Phrasebook &amp; volunteering</a>
      · <a href="{{ url_for('itinerary_page') }}">🗒 Itinerary builder</a>
    </p>

    <div id="place-banner" class="place-banner" hidden>
      <span id="place-label"></span>
      <button type="button" id="refresh" title="Refresh">↻</button>
    </div>

    <div id="stale-banner" class="banner stale" hidden></div>

    <div id="out" class="out">
      <p class="hint">Search for a place, or tap "Near me", to see live conditions.</p>
    </div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/live.js') }}"></script>
{% endblock %}
